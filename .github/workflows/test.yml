name: "build-test"
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
  schedule:
    - cron: '0 9 * * *'

jobs:
  unit: # make sure build/ci work properly
    strategy:
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - run: |
        npm install
        npm run all

  integration: # make sure the action works on a clean machine without building
    needs:
      - unit
    strategy:
      matrix:
        project:
          - core
          - core20
          - core22
          - core24
        include:
          - core: core
            channel: 4.x/stable
            runner: ubuntu-22.04
          - core: core20
            channel: 8.x/stable
            runner: ubuntu-24.04
          - core: core22
            channel: stable
            runner: ubuntu-26.04
          - core: core24
            channel: stable
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - uses: ./
      id: snapcraft
      with:
        path: './test-projects/${{ matrix.project }}'
        snapcraft-channel: ${{ matrix.channel }}
    - uses: actions/upload-artifact@v7
      with:
        name: 'snap-${{ matrix.project }}'
        path: ${{ steps.snapcraft.outputs.snap}}
        compression-level: 0
        retention-days: 7

  collect-artifacts:
    needs:
      - integration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/upload-artifact/merge@v7
      with:
        name: snap
        pattern: snap-*
        delete-merged: true
        retention-days: 7

  check-runner: # make sure the action works on each VM image
    needs:
      - integration
    strategy:
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./
      with:
        path: './test-projects/core22'
